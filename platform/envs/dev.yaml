# Self-service lower-env declaration (idp/docs/gitops-strategy.md §10) - a developer
# commits straight here, no release pipeline, no gitops-checkout-api repo
# involved. Read live by this repo's own checkout-api-lower-envs ApplicationSet
# (gitops-cluster-dev, generated per-app by tenant-appprojects) to provision this
# env's namespace via idp-service-catalog's idp-application chart.
#
# envName, not env - this file also gets fed straight into idp-application's own
# Helm values, where env: is already a reserved key (the chart's container env-var
# list). A real gotcha, not a guess: an earlier env: dev here produced a live
# "range can't iterate over dev" Helm error inside that chart.
#
# rollout: null (not left unset) - bootstrap stub, same convention
# ApplicationEnvironment's own initial values.yaml uses. Confirmed live this has to
# be explicit: the chart's OWN default rollout: (values.yaml) is a non-null object
# with an empty image.repository/tag, not skipped - leaving this key out entirely
# rendered a real Rollout with two InvalidImageName pods instead of the clean
# namespace-only stub. No real image to deploy yet - just the baseline
# namespace/ServiceAccount/NetworkPolicy until a developer's own follow-up commit
# sets a real rollout.image.
envName: dev
rollout: null
