# k8s/ephemeral/namespace.yaml
#
# Tracked as a real, managed resource - deliberately NOT relying on ArgoCD's
# CreateNamespace=true sync option alone. Verified live against a real cluster
# (platform-cicd's plan, "Phase 2 Item 3" verification section): a namespace created only
# via CreateNamespace=true is NOT part of the Application's own tracked-resource set, so
# the resources-finalizer.argocd.argoproj.io finalizer cascade-deletes the Deployment/
# Service inside it but leaves the namespace itself orphaned forever - exactly the bug
# the old cd-pipelines system hit and never fixed (see docs/ephemeral-environments.md).
# Including the Namespace here, as a plain tracked resource, makes it part of that same
# cascade-delete - confirmed live, this is what actually closes the gap.
#
# Base name is deliberately incomplete ("...-pr", no trailing number) - the
# ApplicationSet's pullRequest-generator template appends "-{{.number}}" via
# kustomize.nameSuffix, so this becomes e.g. platform-cicd-demo-pr-42 at generation time.
# The negative sync-wave makes this apply before the Deployment/Service need the
# namespace to exist.
#
# The platform.io/ephemeral-env label is what the TTL backstop sweep CronJob
# (platform-cicd's platform/argocd/pr-namespace-ttl-sweep-cronjob.yaml) selects on - the
# old cd-pipelines system's own branch-based ephemeral namespaces had an equivalent
# label but its PR-based ones never did, which is exactly why that system's one
# TTL-sweep mechanism could never be pointed at PR-based envs even after the fact.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-cicd-demo-pr
  labels:
    platform.io/ephemeral-env: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
