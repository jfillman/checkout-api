apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ci-
  labels:
    platform.io/flow: "ci"
    platform.io/stage: "build"
    platform.io/step-index: "0"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"

    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: build }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: git-url, value: "{{ repo_url }}" }
    - { name: git-revision, value: "{{ revision }}" }
    - { name: image-repo, value: "ghcr.io/jfillman/checkout-api" }
    - { name: app-namespace, value: "app-checkout-api-cicd" }
    - { name: app-name, value: "checkout-api" }
    - { name: app-type, value: "app" }
    - { name: is-flow-terminal, value: "true" }

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "1h"
