# BOILERPLATE - see push.yaml for the general pattern. Unlike push.yaml/pull-request.yaml,
# this re-invokes the onboarding-delivery mechanism itself
# (deliver-onboarding-files.yaml) whenever cicd.yaml changes on a push to main, via PaC's
# `"cicd.yaml".pathChanged()` CEL extension. This is what keeps this Application's own
# onboarding boilerplate in sync when the platform's templates change too - one re-sync
# path handles both cases. Templates live at
# charts/platform-cicd-app/files/onboarding-templates/, delivered via a ConfigMap (not
# baked into the toolbox image), so an edit takes effect on this app's next `helm upgrade`.
#
# app-checkout-api-cicd, checkout-api, app, jfillman, and (if a release stage is
# declared)  are filled in by deliver-onboarding-files.yaml's own
# substitution loop when it delivers this file.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: onboarding-resync-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: '"cicd.yaml".pathChanged()'
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - { name: kind, value: pipeline }
      - { name: name, value: onboarding-resync }
      - { name: namespace, value: platform-catalog }
  params:
    - { name: git-url, value: "{{ repo_url }}" }
    - { name: app-namespace, value: "app-checkout-api-cicd" }
    - { name: app-name, value: "checkout-api" }
    - { name: app-type, value: "app" }
    - { name: github-owner, value: "jfillman" }
    - { name: gitops-repo-url, value: "https://github.com/jfillman/gitops-checkout-api" }
  taskRunTemplate:
    serviceAccountName: pipeline-runner
  timeouts:
    pipeline: "10m"
