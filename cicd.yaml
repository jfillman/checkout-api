apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false
  cache:
    enabled: true
    size: small
  sourceVolume:
    size: small

test:
  enabled: true
  name: integration

deploy:
  lowerEnvironments:
    - dev
    - test
    - rel
    - perf
  upperEnvironments:
    - name: prod
      cluster: kind-prod
    - name: pre-prod
      cluster: kind-prod
    - name: staging
      cluster: kind-prod
    - name: proofing
      cluster: kind-prod
  strategy: deployment
  promotionOrder:
    - dev
    - test
    - rel
    - perf
    - proofing
    - staging
    - pre-prod
    - prod

ephemeralEnvironments:
  branch:
    enabled: false
    patterns:
      - preview/*
  pullRequest:
    enabled: true
    labels:
      - preview
  ttl: 5d

governance:
  sast: true
  imageScan: true
  policyCheck: true
  sbom: true
  allowedCommitSigners:
    - crossfader@gmail.com
    - 7268337+jfillman@users.noreply.github.com

secrets:
  - name: slack-webhook-url

notifications:
  slack:
    enabled: true
    channel: "#all-idp-lab"
    scanResults: false
  backstage:
    enabled: true

# Migrated from the legacy `pipeline:` (singular) list form - removed from the schema
# in an earlier session (both `pipeline:` itself and each step's `after:` field, which
# never did anything: chaining was always positional). Same build->test->deploy(dev)
# shape as before, just expressed the current way - see docs/user-guide/cicd-yaml-reference.md.
pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: deploy
        env: dev
      - stage: test
        env: dev
      - stage: deploy
        env: test
      - stage: test
        env: test
