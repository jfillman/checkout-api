apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false
  cache:
    enabled: true

test:
  enabled: true
  suite: integration # runs ./integration-test.sh, see that file

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: false
  ttl: 5d

governance:
  sast: true
  imageScan: false
  policyCheck: false
  sbom: true

notifications:
  slack:
    enabled: true

pipeline:
  - stage: build
  - stage: test
    after: build
  - stage: deploy
    after: test
    env: dev
