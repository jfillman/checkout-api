apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false
  cache:
    enabled: true

test:
  name: integration # runs platform/integration.yaml (Testkube TestWorkflow)

deploy:
  lowerEnvironments: [dev]
  # object form, not the plain string [prod] - cluster: is now required
  # (open-release-pr.yaml's gitops-checkout-api layout is <cluster>/<env>/values.yaml,
  # matching idp-service-catalog's ApplicationEnvironment.spec.cluster for this same
  # env - see that Task's own 2026-08-16 header note).
  upperEnvironments:
    - { name: prod, cluster: kind-prod }
    - { name: staging, cluster: kind-prod }
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: true
  ttl: 5d

governance:
  sast: false
  imageScan: false
  policyCheck: false
  sbom: false
  allowedCommitSigners:
    - crossfader@gmail.com
    - 7268337+jfillman@users.noreply.github.com

secrets:
  - name: slack-webhook-url

notifications:
  slack:
    enabled: true
    channel: "#all-idp-lab"

# Migrated from the legacy `pipeline:` (singular) list form - removed from the schema
# in an earlier session (both `pipeline:` itself and each step's `after:` field, which
# never did anything: chaining was always positional). Same build->test->deploy(dev)
# shape as before, just expressed the current way - see docs/user-guide/cicd-yaml-reference.md.
pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: test
        env: dev
      - stage: deploy
        env: dev
      - stage: release
        env: staging
      - stage: release
        env: prod
        # no branch filter - any push to main triggers a release to prod, not just the
        # first one (the "release" stage is idempotent, so this is safe and useful)
  # No hand-written pr-build entry needed anymore - ephemeralEnvironments.pullRequest.
  # enabled above is now the whole switch. deliver-onboarding-files.yaml synthesizes a
  # pull_request-triggered, build-only, -pr-tagged flow automatically (branch/labels
  # derived from ci's own branch and ephemeralEnvironments.pullRequest.labels) whenever
  # this is true and no explicit pipelines.pr-build is declared - see that Task's own
  # 2026-08-24 header note. Declare pipelines.pr-build explicitly here only to override
  # the default shape (a different base branch, extra steps, etc).
# trigger onboarding-resync: re-fire now that platform-cicd-catalog's ArgoCD sync of the
