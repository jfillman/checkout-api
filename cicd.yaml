apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  # TEMPORARY test of the multi-stage-Dockerfile path (Phase 3 item 8.1 live
  # verification) - script omitted entirely, dockerfile points at a throwaway
  # multi-stage variant. Revert both lines after this test.
  dockerfile: ./Dockerfile.multistage-test
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false

test:
  enabled: true
  suite: integration # runs ./integration-test.sh, see that file

deploy:
  lowerEnvironments: [dev]
  upperEnvironments: []
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: false
  ttl: 5d

governance:
  sast: false
  imageScan: false
  policyCheck: false
  sbom: false

notifications:
  slack:
    enabled: true

pipeline:
  - stage: build
  - stage: test
    after: build
  - stage: deploy
    after: test
    env: dev
