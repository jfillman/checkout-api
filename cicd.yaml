apiVersion: platform/v1
kind: PipelineConfig

build:
  agent: nodejs-20
  script: ./build.sh
  dockerfile: ./Dockerfile
  unitTest:
    enabled: true
    command: ./test.sh
  sonar: false
  cache:
    enabled: true

test:
  suite: integration # runs ./integration-test.sh, see that file

deploy:
  lowerEnvironments: [dev]
  # object form, not the plain string [prod] - cluster: is now required
  # (open-release-pr.yaml's gitops-checkout-api layout is <cluster>/<env>/values.yaml,
  # matching idp-service-catalog's ApplicationEnvironment.spec.cluster for this same
  # env - see that Task's own 2026-08-16 header note).
  upperEnvironments:
    - { name: prod, cluster: kind-prod }
  strategy: deployment

ephemeralEnvironments:
  branch:
    enabled: false
  pullRequest:
    enabled: true
  ttl: 5d

governance:
  sast: true
  imageScan: true
  policyCheck: true
  sbom: true
  allowedCommitSigners:
    - crossfader@gmail.com
    - 7268337+jfillman@users.noreply.github.com

secrets:
  - name: slack-webhook-url

notifications:
  slack:
    enabled: true
    channel: "#all-idp-lab"

# Migrated from the legacy `pipeline:` (singular) list form - removed from the schema
# in an earlier session (both `pipeline:` itself and each step's `after:` field, which
# never did anything: chaining was always positional). Same build->test->deploy(dev)
# shape as before, just expressed the current way - see docs/user-guide/cicd-yaml-reference.md.
pipelines:
  ci:
    trigger:
      source: git
      event: push
      branch: main
    steps:
      - stage: build
      - stage: test
        env: dev
      - stage: deploy
        env: dev
      - stage: release
        env: prod
  # Builds and pushes ghcr.io/jfillman/checkout-api-pr:<12-char-sha> for every PR
  # targeting main - deliver-onboarding-files.yaml's generator already appends "-pr" to
  # the image repo for a pull_request-triggered flow, it just needed a pipelines: entry
  # here to actually generate .tekton/flow-pr-build.yaml. Without this, ephemeralEnvironments.
  # pullRequest's own ApplicationSet (platform-cicd's ephemeral-envs.yaml) has nothing
  # that ever produces the image it expects - found live 2026-08-24 chasing a PR preview
  # env stuck in ImagePullBackOff. (Touched again same day to force onboarding-resync to
  # regenerate .tekton/flow-pr-build.yaml against build-image.yaml's new pr-tag-only
  # param - onboarding-resync only reacts to a real cicd.yaml diff on main.)
  pr-build:
    trigger:
      source: git
      event: pull_request
      branch: main
    steps:
      - stage: build
# trigger onboarding-resync: pick up comment-pr-check-result's new revision param
